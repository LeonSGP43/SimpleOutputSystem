name: CI/CD Pipeline

# 触发条件：main分支推送（合并PR后）或手动触发
on:
  push:
    branches: [ develop ]
  workflow_dispatch:  # 允许手动触发

# 定义作业
jobs:
  # 作业1：CI（测试+构建镜像）
  ci:
    runs-on: ubuntu-latest  # 运行在Ubuntu服务器上

    steps:
      # 步骤1：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：安装依赖
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤4：运行代码规范检查（black+flake8）
      - name: Run code style checks
        run: |
          black --check .  # 检查是否符合格式化规范
          flake8 .        # 检查语法错误

      # 步骤5：运行单元测试
      - name: Run unit tests
        run: |
          pytest tests/ -v

      # 步骤6：构建Docker镜像（并推送到GitHub Container Registry）
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # GitHub自动生成的密钥

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/leonsgp43/output-service:latest  # 镜像标签

  # 作业2：CD（部署到阿里云ECS）
  cd:
    needs: ci  # 依赖ci作业完成且成功
    runs-on: ubuntu-latest

    steps:
      # 步骤1：拉取代码（获取部署脚本）
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：配置SSH，连接阿里云ECS
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}  # 阿里云ECS的SSH私钥（存放在GitHub Secrets）

      # 步骤3：部署到ECS（拉取镜像+重启容器）
      - name: Deploy to Aliyun ECS
        run: |
          # 连接ECS，执行部署命令
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \  # 每30秒发一次心跳包
            -o ServerAliveCountMax=10 \  # 10次心跳无响应才断开（容错性更高）
            root@${{ secrets.ECS_IP }} << 'EOF'
            # 1. 服务器登录GHCR（解决拉取权限问题）
            docker login ghcr.io -u leonsgp43 -p ${{ secrets.GHCR_PAT }}
            # 拉取最新镜像（GitHub Container Registry）
            docker pull ghcr.io/leonsgp43/output-service:latest

            # 停止并删除旧容器
            docker stop output-service || true
            docker rm output-service || true

            # 启动新容器（使用生产环境变量）
            docker run -d \
              --name output-service \
              -p 51000:51000 \
              -e FLASK_ENV=production \
              -e SECRET_KEY=${{ secrets.PROD_SECRET_KEY }} \
              -e LOG_LEVEL=INFO \\
              -v /root/output-service/logs:/app/logs \
              --restart always \
              ghcr.io/leonsgp43/output-service:latest

            # 清理旧镜像（避免磁盘占用）
            docker system prune -f
          EOF
